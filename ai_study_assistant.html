<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>AI Study Assistant | Polytechnic Hub</title>
    <meta name="description" content="Meet your personalized AI Study Assistant for Diploma Engineering. Solve doubts, prepare for exams, and understand complex technical concepts instantly.">
    <meta name="keywords" content="AI Study Assistant, Polytechnic Helper, Engineering Chatbot, Diploma Studies, SGPA Calculator, Exam Prep AI">
    <meta name="author" content="LK Study Studio">
    <meta name="robots" content="index, follow">

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="AI Study Assistant for Engineering Students">
    <meta property="og:description" content="Ask any technical doubt, syllabus questions, or get career guidance instantly with our smart AI assistant.">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#020617',
                            panel: 'rgba(15, 23, 42, 0.6)',
                            primary: '#3b82f6',
                            secondary: '#8b5cf6',
                            accent: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #020617;
            color: #ffffff;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.1), transparent 25%);
            background-attachment: fixed;
        }

        .glass-panel {
            background: var(--brand-panel);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: #3b82f6;
            outline: none;
        }

        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .msg-bubble {
            max-width: 85%;
            animation: slideUp 0.3s forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .msg-ai {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom-left-radius: 4px;
        }

        .msg-user {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-bottom-right-radius: 4px;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .typing-indicator span {
            display: inline-block; width: 6px; height: 6px; background-color: #06b6d4;
            border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .msg-ai strong { color: #60a5fa; }
        .error-text { color: #f87171 !important; }
    </style>
</head>
<body class="antialiased selection:bg-brand-primary selection:text-white flex flex-col h-screen">

    <!-- Header -->
    <header class="fixed w-full top-0 z-40 bg-brand-bg/90 backdrop-blur-xl border-b border-white/10 shrink-0 h-20">
        <div class="container mx-auto px-4 h-full flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center">
                    <i class="fa-solid fa-arrow-left text-white"></i>
                </div>
                <h1 class="text-xl font-heading font-bold tracking-wide text-white">STUDY <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">AI</span></h1>
            </a>
            <div id="api-status" class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
            </div>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-grow pt-20 flex overflow-hidden container mx-auto">
        <aside class="hidden lg:flex w-80 flex-col border-r border-white/5 p-6 h-full shrink-0">
            <div class="mb-8">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Study Assistant</h3>
                <p class="text-sm text-gray-400 leading-relaxed">Ask me anything about your syllabus, career, or technical concepts.</p>
            </div>
            <div class="flex flex-col gap-3">
                <button class="quick-prompt text-left px-4 py-3 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-all text-sm text-gray-300">
                    <i class="fa-solid fa-bolt text-cyan-400 mr-2"></i> What is Electrical Engineering?
                </button>
                <button class="quick-prompt text-left px-4 py-3 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-all text-sm text-gray-300">
                    <i class="fa-solid fa-calculator text-purple-400 mr-2"></i> How is CGPA calculated?
                </button>
                <button class="quick-prompt text-left px-4 py-3 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-all text-sm text-gray-300">
                    <i class="fa-solid fa-book-open text-blue-400 mr-2"></i> Exam Prep Tips
                </button>
            </div>
        </aside>

        <section class="flex-grow flex flex-col relative h-full max-w-4xl mx-auto w-full">
            <div id="chat-body" class="flex-grow overflow-y-auto chat-scroll p-4 md:p-6 pb-32 flex flex-col gap-6">
                <div class="flex gap-4 w-full">
                    <div class="w-10 h-10 shrink-0 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center">
                        <i class="fa-solid fa-robot text-white text-sm"></i>
                    </div>
                    <div class="msg-bubble msg-ai px-5 py-4 rounded-2xl rounded-tl-none text-gray-200 text-sm md:text-base leading-relaxed">
                        <h3 class="text-lg font-bold text-white mb-2 font-heading">Hello! I'm your Polytechnic AI. 👋</h3>
                        <p>I am securely connected via backend server. How can I help you today?</p>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-0 left-0 w-full p-4 md:p-6 bg-gradient-to-t from-brand-bg to-transparent">
                <div class="glass-panel p-2 rounded-2xl flex items-end gap-2 shadow-2xl">
                    <textarea id="user-input" rows="1" placeholder="Type your doubt here..." class="glass-input w-full px-4 py-3.5 rounded-xl resize-none min-h-[50px] max-h-[150px] chat-scroll"></textarea>
                    <button id="btn-send" class="w-12 h-12 shrink-0 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 text-white font-bold flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatBody = document.getElementById('chat-body');
            const userInput = document.getElementById('user-input');
            const btnSend = document.getElementById('btn-send');
            const quickPrompts = document.querySelectorAll('.quick-prompt');
            let isTyping = false;

            userInput.addEventListener('input', function() {
                this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px';
                if(this.value.trim() === '') this.style.height = '50px';
            });

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
            });

            btnSend.addEventListener('click', handleSend);
            quickPrompts.forEach(btn => btn.addEventListener('click', () => { userInput.value = btn.innerText.trim(); handleSend(); }));

            async function handleSend() {
                const text = userInput.value.trim();
                if (!text || isTyping) return;

                appendMessage('user', text);
                userInput.value = ''; userInput.style.height = '50px'; btnSend.disabled = true;

                const typingId = showTypingIndicator();
                isTyping = true;

                try {
                    // SECURE CALL TO VERCEL API
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || "Server error");
                    
                    document.getElementById(typingId).remove();
                    appendMessage('ai', data.reply);
                } catch (error) {
                    document.getElementById(typingId).remove();
                    appendMessage('ai', `<span class="error-text">**Error:** ${error.message}</span>`);
                } finally {
                    isTyping = false; btnSend.disabled = false;
                }
            }

            function appendMessage(role, text) {
                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex gap-4 w-full ${role === 'user' ? 'justify-end' : ''}`;
                const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                
                if (role === 'ai') {
                    msgWrapper.innerHTML = `
                        <div class="w-10 h-10 shrink-0 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center"><i class="fa-solid fa-robot text-white text-sm"></i></div>
                        <div class="msg-bubble msg-ai px-5 py-4 rounded-2xl rounded-tl-none text-gray-200 text-sm md:text-base">${formattedText}</div>
                    `;
                } else {
                    msgWrapper.innerHTML = `
                        <div class="msg-bubble msg-user px-5 py-3.5 rounded-2xl rounded-br-none text-white text-sm md:text-base">${formattedText}</div>
                        <div class="w-10 h-10 shrink-0 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-user text-white text-sm"></i></div>
                    `;
                }
                chatBody.appendChild(msgWrapper);
                chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
            }

            function showTypingIndicator() {
                const id = 'typing-' + Date.now();
                const msgWrapper = document.createElement('div');
                msgWrapper.id = id;
                msgWrapper.className = `flex gap-4 w-full`;
                msgWrapper.innerHTML = `
                    <div class="w-10 h-10 shrink-0 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center"><i class="fa-solid fa-robot text-white text-sm"></i></div>
                    <div class="msg-bubble msg-ai px-5 py-4 rounded-2xl rounded-tl-none flex items-center h-[52px]">
                        <div class="typing-indicator"><span></span><span></span><span></span></div>
                    </div>
                `;
                chatBody.appendChild(msgWrapper);
                chatBody.scrollTo({ top: chatBody.scrollHeight, behavior: 'smooth' });
                return id;
            }
        });
    </script>
</body>
</html>
